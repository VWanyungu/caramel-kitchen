# fly.toml — Fly.io deployment configuration

app = "caramel-kitchen-api"
primary_region = "lhr"  # London (closest to African market)

[build]
  dockerfile = "Dockerfile"

[env]
  PHX_HOST    = "api.caramelkitchen.app"
  PORT        = "4000"
  POOL_SIZE   = "10"
  MIX_ENV     = "prod"

[http_service]
  internal_port        = 4000
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 2

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 1000
    soft_limit = 800

  [[http_service.checks]]
    grace_period = "10s"
    interval     = "30s"
    method       = "GET"
    path         = "/health"
    port         = 4000
    timeout      = "5s"
    type         = "http"

[[vm]]
  memory      = "1gb"
  cpu_kind    = "shared"
  cpus        = 2

[[services.ports]]
  port     = 80
  handlers = ["http"]
  force_https = true

[[services.ports]]
  port     = 443
  handlers = ["tls", "http"]

# Scale to 2 nodes minimum in production
[deploy]
  strategy = "rolling"

[mounts]
  source      = "caramel_data"
  destination = "/data"
